[package]
name = "downtime"
version = "0.1.0"
description = "Flashcard overlay for video game downtime"
edition = "2021"
license = "MIT"
repository = "https://github.com/dimslalom/downtime"

[lib]
name = "downtime_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
fsrs = "=6.6.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-single-instance = "2.5.5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
